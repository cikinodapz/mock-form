<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <title>mock-form</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --accent: #0f172a;
      --accent-hover: #334155;
      --text: #0f172a;
      --text-secondary: #475569;
      --muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
      --ring: rgba(15, 23, 42, 0.1);
      --radius: 8px;
    }

    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      width: 360px;
      height: 550px;
      overflow: hidden;
      background: var(--bg);
    }

    body {
      width: 360px;
      height: 550px;
      margin: 0 auto;
      background: var(--surface);
      color: var(--text);
      font-family: 'Inter', -apple-system, sans-serif;
      font-size: 13px;
      line-height: 1.5;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── Header ─── */
    .header {
      flex-shrink: 0;
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo-row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 28px;
      height: 28px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon img {
      width: 28px;
      height: 28px;
      object-fit: contain;
    }

    .logo-text h1 {
      font-size: 14px;
      font-weight: 600;
      color: var(--text);
      letter-spacing: -0.02em;
    }

    .logo-text p {
      font-size: 10.5px;
      color: var(--muted);
      margin-top: 1px;
    }

    /* ─── Tabs ─── */
    .tabs {
      flex-shrink: 0;
      display: flex;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
    }

    .tab {
      flex: 1;
      padding: 9px 0;
      text-align: center;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      transition: color 0.15s, border-color 0.15s;
      user-select: none;
    }

    .tab:hover {
      color: var(--text-secondary);
    }

    .tab.active {
      color: var(--accent);
      border-bottom-color: var(--accent);
    }

    /* ─── Content ─── */
    .content {
      display: none;
      padding: 14px;
      overflow-x: hidden;
    }

    .content.active {
      display: block;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 14px;
    }

    /* ─── Form ─── */
    .form-group {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 5px;
    }

    input[type="text"],
    input[type="password"],
    textarea,
    select {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: inherit;
      font-size: 12.5px;
      padding: 8px 10px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder,
    textarea::placeholder {
      color: var(--muted);
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 2px var(--ring);
    }

    textarea {
      resize: vertical;
      min-height: 72px;
      line-height: 1.5;
    }

    select {
      appearance: auto;
      cursor: pointer;
    }

    /* ─── API Key ─── */
    .api-key-wrap {
      position: relative;
    }

    .api-key-wrap input {
      padding-right: 36px;
    }

    .toggle-vis {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: var(--muted);
      background: none;
      border: none;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2px;
    }

    .toggle-vis:hover {
      color: var(--text);
    }

    .toggle-vis svg {
      width: 15px;
      height: 15px;
    }

    /* ─── Buttons ─── */
    .btn {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: var(--radius);
      font-family: inherit;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      white-space: nowrap;
    }

    .btn svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .btn-secondary:hover {
      background: var(--bg);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* ─── Status ─── */
    .status {
      padding: 8px 10px;
      border-radius: var(--radius);
      font-size: 11.5px;
      margin-top: 10px;
      display: none;
      align-items: flex-start;
      gap: 7px;
      line-height: 1.5;
    }

    .status.show {
      display: flex;
    }

    .status.success {
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .status.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: #991b1b;
    }

    .status.info {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text-secondary);
    }

    .status svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
      margin-top: 1px;
    }

    /* ─── Loader ─── */
    .loader {
      width: 12px;
      height: 12px;
      border: 1.5px solid rgba(0, 0, 0, 0.08);
      border-top-color: currentColor;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ─── Fields Preview ─── */
    .fields-list {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 6px;
      margin-top: 10px;
      max-height: 130px;
      overflow-y: auto;
    }

    .field-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 8px;
      font-size: 11.5px;
      border-bottom: 1px solid var(--border);
    }

    .field-item:last-child {
      border-bottom: none;
    }

    .field-badge {
      font-size: 9.5px;
      padding: 1px 5px;
      border-radius: 4px;
      background: var(--surface);
      color: var(--muted);
      font-weight: 500;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ─── Divider ─── */
    .divider {
      height: 1px;
      background: var(--border);
      margin: 16px 0;
    }

    /* ─── Section Title ─── */
    .section-title {
      font-size: 12px;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 10px;
    }

    /* ─── Profiles ─── */
    .profile-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .profile-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 10px;
      display: flex;
      align-items: center;
      gap: 10px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    .profile-card:hover {
      border-color: var(--accent);
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }

    .profile-card.active {
      border-color: var(--accent);
      background: #f0f9ff;
    }

    .profile-avatar {
      width: 32px;
      height: 32px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .profile-info {
      flex: 1;
      min-width: 0;
    }

    .profile-name {
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-desc {
      font-size: 10.5px;
      color: var(--muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .profile-actions {
      display: flex;
      gap: 4px;
      flex-shrink: 0;
    }

    .icon-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      color: var(--muted);
      width: 26px;
      height: 26px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s;
    }

    .icon-btn svg {
      width: 13px;
      height: 13px;
    }

    .icon-btn:hover {
      background: var(--bg);
      color: var(--text);
    }

    .icon-btn.delete:hover {
      color: var(--danger);
      border-color: var(--danger);
      background: #fef2f2;
    }

    .icon-btn.use:hover {
      color: var(--success);
      border-color: var(--success);
      background: #f0fdf4;
    }

    .empty-state {
      text-align: center;
      padding: 24px 16px;
      color: var(--muted);
      font-size: 11.5px;
      line-height: 1.6;
      border: 1px dashed var(--border);
      border-radius: var(--radius);
      background: var(--bg);
    }

    /* ─── Footer ─── */
    .footer {
      flex-shrink: 0;
      margin-top: auto;
      padding: 8px 14px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .model-badge {
      display: flex;
      align-items: center;
      gap: 5px;
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
      min-width: 0;
    }

    .model-badge span {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--success);
      flex-shrink: 0;
    }

    .link-btn {
      font-size: 10.5px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      white-space: nowrap;
      flex-shrink: 0;
      transition: color 0.15s;
    }

    .link-btn:hover {
      color: var(--text);
    }

    /* ─── Button Row ─── */
    .btn-row {
      display: flex;
      gap: 6px;
      margin-top: 12px;
    }

    .btn-row .btn {
      flex: 1;
      min-width: 0;
      font-size: 11.5px;
      padding: 8px 4px;
    }

    /* ─── Detected Badge ─── */
    .detected-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11.5px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar {
      width: 3px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: var(--muted);
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="logo-row">
      <div class="logo-icon">
        <img src="icons/logo-ui.png" alt="mock-form logo">
      </div>
      <div class="logo-text">
        <h1>mock-form</h1>
        <p>AI Form Assistant</p>
      </div>
    </div>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="fill">Isi Form</div>
    <div class="tab" data-tab="profiles">Profil</div>
    <div class="tab" data-tab="settings">Setelan</div>
  </div>

  <!-- TAB: FILL -->
  <div class="content active" id="tab-fill">
    <div class="section-title">Instruksi untuk AI</div>
    <div class="form-group">
      <textarea id="instruction"
        placeholder="Contoh: Isi dengan data diri saya, nama John Doe, email john@email.com, perusahaan Acme Corp..."
        rows="4"></textarea>
    </div>

    <div id="detected-info" style="display:none;">
      <div class="detected-badge">
        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
        <span id="field-count">0 field terdeteksi</span>
      </div>
      <div class="fields-list" id="fields-preview"></div>
    </div>

    <div class="btn-row">
      <button class="btn btn-secondary" id="btn-scan">Scan</button>
      <button class="btn btn-secondary" id="btn-inject-photos"
        style="color:var(--success);border-color:var(--success);">Suntik Foto</button>
      <button class="btn btn-primary" id="btn-fill">Isi Otomatis</button>
    </div>

    <div class="status" id="fill-status">
      <span class="icon"></span>
      <span class="msg"></span>
    </div>
  </div>

  <!-- TAB: PROFILES -->
  <div class="content" id="tab-profiles">
    <div class="section-title">Profil Tersimpan</div>
    <div class="profile-list" id="profile-list">
      <div class="empty-state">
        Belum ada profil.<br>Tambah profil untuk mengisi form lebih cepat.
      </div>
    </div>

    <div class="divider"></div>

    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
      <div class="section-title" id="form-title" style="margin-bottom:0;">Tambah Profil Baru</div>
      <button id="btn-cancel-edit" class="btn-secondary"
        style="width:auto; padding:4px 8px; font-size:11px; display:none;">Batal</button>
    </div>
    <input type="hidden" id="edit-index" value="-1">

    <div class="form-group">
      <label>Nama Profil</label>
      <input type="text" id="profile-name" placeholder="cth: Profil Kerja, Profil Pribadi">
    </div>
    <div class="form-group">
      <label>Data Profil</label>
      <textarea id="profile-data" rows="4"
        placeholder="Nama: John Doe&#10;Email: john@email.com&#10;Telepon: 08123456789&#10;Perusahaan: Acme Corp&#10;Alamat: Jl. Sudirman No. 1, Jakarta"></textarea>
    </div>
    <div class="form-group">
      <label>Lampiran File/Foto (Opsional)</label>
      <input type="file" id="profile-image" accept="image/png, image/jpeg" style="font-size:11px;">
      <div id="image-preview" style="margin-top:8px; display:none;">
        <img src="" style="max-width:100%; max-height:80px; border-radius:4px; border:1px solid var(--border);">
      </div>
    </div>
    <button class="btn btn-primary" id="btn-save-profile">Simpan Profil</button>

    <div class="status" id="profile-status"></div>
  </div>

  <!-- TAB: SETTINGS -->
  <div class="content" id="tab-settings">
    <div class="section-title">API Key</div>
    <div class="form-group">
      <label>Google AI Studio API Key</label>
      <div class="api-key-wrap">
        <input type="password" id="api-key" placeholder="AIza...">
        <button class="toggle-vis" id="toggle-key">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <a href="https://aistudio.google.com/app/apikey" target="_blank" style="text-decoration:none;">
      <button class="btn btn-secondary" style="margin-bottom: 16px;">Dapatkan API Key</button>
    </a>

    <div class="divider" style="margin-top:0;"></div>

    <div class="section-title">Model</div>
    <div class="form-group">
      <label>Pilih Model Gemini</label>
      <select id="model-select">
        <option value="gemini-3.7-flash">Gemini 3.7 Flash</option>
        <option value="gemini-3.6-flash">Gemini 3.6 Flash</option>
        <option value="gemini-3.1-flash-lite">Gemini 3.1 Flash Lite</option>
        <option value="gemini-3-flash">Gemini 3 Flash</option>
        <option value="gemini-2.5-flash">Gemini 2.5 Flash</option>
        <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite</option>
        <option value="gemini-2.0-flash">Gemini 2.0 Flash</option>
        <option value="gemini-1.5-flash">Gemini 1.5 Flash</option>
      </select>
    </div>

    <div class="divider"></div>

    <div class="section-title">Tampilan Ekstensi</div>
    <div class="form-group" style="margin-bottom: 20px;">
      <label>Mode Tampilan</label>
      <select id="display-mode">
        <option value="popup">Popup Biasa (Klasik)</option>
        <option value="widget">Widget Mengambang (Di Dalam Web)</option>
        <option value="contextual">Ikon Kontekstual (Klik Langsung Isi Form)</option>
      </select>
    </div>

    <div class="section-title">Opsi Pengisian</div>
    <div class="form-group" style="margin-bottom: 20px;">
      <label>Mode Pengisian</label>
      <select id="fill-mode">
        <option value="smart">Smart — Deteksi konteks otomatis</option>
        <option value="strict">Strict — Hanya field dengan label jelas</option>
      </select>
    </div>

    <div class="status" id="settings-status" style="margin-top: 0; margin-bottom: 12px;"></div>
    <button class="btn btn-primary" id="btn-save-settings">Simpan Setelan</button>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="model-badge">
      <div class="dot"></div>
      <span id="footer-model">Gemini 2.5 Flash Lite</span>
    </div>
    <button class="link-btn" id="btn-clear-all">Bersihkan Form</button>
  </div>

  <script src="popup.js"></script>
</body>

</html>
